name: CI Tests

on:
  push:
    branches: [ main, develop, add_unit_test ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests (.NET)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --configuration Release --no-restore
      
    - name: Run backend tests
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory TestResults/
      
    - name: Upload backend test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: TestResults/
        
    - name: Upload backend code coverage
      uses: codecov/codecov-action@v4
      if: always()
      with:
        directory: TestResults/
        flags: backend
        name: backend-coverage

  frontend-tests:
    name: Frontend Tests (React/Vitest)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: react-app/package-lock.json
        
    - name: Install frontend dependencies
      working-directory: react-app
      run: npm ci
      
    - name: Run frontend linting
      working-directory: react-app
      run: npm run lint
      
    - name: Build frontend
      working-directory: react-app
      run: npm run build
      
    - name: Run frontend tests with coverage
      working-directory: react-app
      run: npm run test:coverage
      
    - name: Upload frontend test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-test-results
        path: react-app/coverage/
        
    - name: Upload frontend code coverage
      uses: codecov/codecov-action@v4
      if: always()
      with:
        directory: react-app/coverage/
        flags: frontend
        name: frontend-coverage

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: TestPassword123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P TestPassword123! -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: react-app/package-lock.json
        
    - name: Install frontend dependencies
      working-directory: react-app
      run: npm ci
      
    - name: Build frontend
      working-directory: react-app
      run: npm run build
      
    - name: Restore .NET dependencies
      run: dotnet restore
      
    - name: Run integration tests
      run: dotnet test --filter "Category=Integration" --verbosity normal
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=PetWhenuaTest;User Id=sa;Password=TestPassword123!;TrustServerCertificate=true;"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, integration-tests]
    if: always()
    
    steps:
    - name: Download backend test results
      uses: actions/download-artifact@v4
      with:
        name: backend-test-results
        path: backend-results/
        
    - name: Download frontend test results
      uses: actions/download-artifact@v4
      with:
        name: frontend-test-results
        path: frontend-results/
        
    - name: Generate test summary
      run: |
        echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Backend Tests (.NET)" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.backend-tests.result }}" == "success" ]; then
          echo "✅ **PASSED** - All backend tests passed successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **FAILED** - Backend tests failed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Frontend Tests (React/Vitest)" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.frontend-tests.result }}" == "success" ]; then
          echo "✅ **PASSED** - All frontend tests passed successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **FAILED** - Frontend tests failed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Integration Tests" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.integration-tests.result }}" == "success" ]; then
          echo "✅ **PASSED** - All integration tests passed successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **FAILED** - Integration tests failed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Coverage Reports" >> $GITHUB_STEP_SUMMARY
        echo "Code coverage reports have been uploaded to Codecov and are available as artifacts." >> $GITHUB_STEP_SUMMARY 